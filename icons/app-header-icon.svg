<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="zpp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hondo borobildu dotorea -->
  <rect width="100" height="100" rx="26" fill="url(#zpp-grad)" />
  <rect x="1" y="1" width="98" height="98" rx="25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Tximista Urrea (Lightning bolt) -->
  <path d="M 36 18 L 22 46 L 36 46 L 26 74 L 54 38 L 38 38 Z" 
        fill="#facc15" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)" />

  <!-- ZPP Testu Argia eta Loditsua -->
  <text x="50" y="86" text-anchor="middle" fill="#ffffff" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" font-size="28" letter-spacing="-0.5px">ZPP</text>
</svg>
